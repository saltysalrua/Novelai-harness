# Anthropic Ivory — Light (Alacritty colors)
# 用法: 在 alacritmy.toml / alacritty.yml 里
#   import = ["themes/anthropic-ivory.alacritty.yaml"]
colors:
  primary:
    background: "#fafaf7" # ivory-light
    foreground: "#191919" # slate-dark
  cursor:
    cursor: "#cc785c" # book-cloth
    text: "#fafaf7"
  selection:
    background: "#191919" # 对齐官网亮色 ::selection (slate-dark)
    text: "#fafaf7"
  normal:
    black: "#f0f0eb" # ivory-medium
    red: "#cc3f35"
    green: "#4e8252"
    yellow: "#a87c4a"
    blue: "#3d7ed2"
    magenta: "#6757c6"
    cyan: "#3d8585"
    white: "#666663" # cloud-dark
  bright:
    black: "#e5e4df" # ivory-dark
    red: "#ef4d43"
    green: "#6ba16f"
    yellow: "#cc9a5f"
    blue: "#6b9fe8"
    magenta: "#8a7ae0"
    cyan: "#5aa8a8"
    white: "#40403e" # slate-light
