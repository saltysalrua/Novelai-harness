name: Release

# 触发方式：pubspec.yaml 有变动时（版本号更新）或手动触发。
# 若 pubspec 里的 version 没有新增（对应 Release 已存在），流程会在检查阶段直接跳过。
on:
  push:
    branches: [master]
    paths: ["pubspec.yaml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 阶段一：读取版本号，判断是否需要发布（便宜，跑在 ubuntu 上）
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Read version from pubspec.yaml
        id: ver
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml \
            | sed -E 's/^version:[[:space:]]*//' \
            | cut -d '+' -f 1 | tr -d ' "')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "解析到版本号: $VERSION"

      - name: Skip if release already exists
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if gh release view "v${VERSION}" \
              --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v${VERSION} 已存在，无事可做。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # 阶段二：构建 Windows 发行包
  build:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          fetch-depth: 0 # 完整历史，用于生成 commit 总结

      # subosito/flutter-action v2.21.0
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: 3.44.0-0.3.pre
          channel: beta
          cache: true

      - name: Build Windows release
        shell: bash
        run: |
          flutter pub get
          flutter build windows --release \
            --build-number ${{ github.run_number }}

      - name: Package Windows build
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $zip = "NovelAI-Harness-v${env:VERSION}-windows-x64.zip"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "$zip" -Force
          Get-Item "$zip" | Select-Object Name, Length

      - name: Generate commit summary
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # 找到上一个版本标签，确定 commit 范围
          PREV_TAG=$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            RANGE_DESC="自上一版本 ${PREV_TAG} 以来"
          else
            FIRST=$(git rev-list --max-parents=0 HEAD | tail -n 1)
            RANGE="${FIRST}..HEAD"
            RANGE_DESC="首次发布"
          fi
          echo "commit 范围: $RANGE"

          NOTES="release_notes.md"
          {
            echo "## NovelAI Harness v${VERSION}"
            echo ""
            echo "${RANGE_DESC}的变更："
            echo ""

            emit() {
              local title="$1" re="$2"
              local body
              body=$(git log "$RANGE" --no-merges \
                     --extended-regexp --regexp-ignore-case \
                     --format='- %s (%h)' --grep="$re" || true)
              if [ -n "$body" ]; then
                echo "### $title"
                echo ""
                echo "$body"
                echo ""
              fi
            }

            emit "新功能" '^feat'
            emit "修复" '^fix'
            emit "性能" '^perf'
            emit "重构" '^refactor'
            emit "文档" '^docs'

            OTHERS=$(git log "$RANGE" --no-merges --format='%s|%h' \
              | grep -viE \
                -e '^(feat|fix|perf|refactor|docs)(\(|:)' \
                -e '^(test|chore|build|ci|style)(\(|:)' \
              | awk -F'|' '{printf "- %s (%s)\n", $1, $NF}')
            if [ -n "$OTHERS" ]; then
              echo "### 其他"
              echo ""
              echo "$OTHERS"
              echo ""
            fi
          } > "$NOTES"

          echo "----- 生成的 Release 说明 -----"
          cat "$NOTES"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NovelAI Harness v${VERSION}" \
            --notes-file release_notes.md \
            "NovelAI-Harness-v${VERSION}-windows-x64.zip"
