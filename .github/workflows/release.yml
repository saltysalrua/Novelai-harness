name: Release

# 触发方式：
#   - push 到 master 且 pubspec.yaml 有变动时（版本号更新自动发布）
#   - workflow_dispatch 手动触发（支持仅构建不发 Release / 跳过测试）
# 若 pubspec 里的 version 对应 Release 已存在，检查阶段会自动跳过（build_only=true 除外）。
#
# 流水线阶段：
#   1. check         → 解析并校验版本号，判断是否需要构建/发布（ubuntu-latest）
#   2. verify        → 运行 dart analyze 与 flutter test 门禁（ubuntu-latest，与构建并行）
#   3. build-windows → Windows x64 绿色包 (zip)
#   4. build-android → Android 分 ABI APK (arm64-v8a / armeabi-v7a / x86_64)
#   5. build-macos   → macOS Apple Silicon (arm64) 应用包 (zip) + 签名与沙盒权限校验
#   6. release       → 汇总产物、生成 SHA256SUMS.txt 与变更说明并创建 GitHub Release
#
# Android 签名（可选）：在仓库 Secrets 中配置下列四项后自动启用正式签名，
# 未配置时回退 debug 签名（APK 仍可直接侧载安装）：
#   ANDROID_KEYSTORE_BASE64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
on:
  push:
    branches: [master]
    paths: ["pubspec.yaml"]
  workflow_dispatch:
    inputs:
      build_only:
        description: "仅构建并上传 Actions 产物，不创建 GitHub Release（即使版本已发布也会构建）"
        type: boolean
        default: false
      skip_tests:
        description: "跳过静态检查与单元测试门禁"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.4"
  FLUTTER_CHANNEL: "stable"

jobs:
  # 阶段一：读取版本号并校验格式，判断是否需要构建与发布（跑在 ubuntu 上开销最低）
  check:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
      should_build: ${{ steps.decide.outputs.should_build }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Read and validate version from pubspec.yaml
        id: ver
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path('pubspec.yaml').read_text(encoding='utf-8')
          match = re.search(
              r'^version:\s*[\'"]?([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)(?:\+[0-9]+)?[\'"]?\s*(?:#.*)?$',
              text,
              re.MULTILINE,
          )
          if match is None:
              raise SystemExit('Expected a semantic version in pubspec.yaml')

          version = match.group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'version={version}\n')
          print(f'解析到版本号: {version}')
          PY

      - name: Decide build & release plan
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only == true }}
        run: |
          RELEASE_EXISTS=false
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          if [ "$BUILD_ONLY" = "true" ]; then
            echo "手动触发仅构建模式 (build_only=true)，跳过 Release 发布。"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE_EXISTS" = "true" ]; then
            echo "Release v${VERSION} 已存在，无事可做。"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "准备构建并发布 v${VERSION}。"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # 阶段二（门禁）：静态检查与全量测试（与各平台构建并行，失败则阻断 Release 发布）
  verify:
    name: Analyze & Test
    needs: check
    if: >-
      needs.check.outputs.should_build == 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.skip_tests == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Analyze
        run: dart run tool/gates.dart analyze

      - name: Run all tests
        run: dart run tool/gates.dart test --concurrency=2 --reporter=expanded --dart-define=HARNESS_AUTO_IMPORT_CREDENTIALS=false

  # 阶段二 A：构建 Windows 发行包
  build-windows:
    name: Build Windows (x64)
    needs: [check, verify]
    if: >-
      !failure() && !cancelled() &&
      needs.check.outputs.should_build == 'true' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Build Windows release
        shell: bash
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build windows --release \
            --build-number "${{ github.run_number }}"

      - name: Package Windows build
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $zip = "NovelAI-Harness-v${env:VERSION}-windows-x64.zip"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "$zip" -Force
          Get-Item "$zip" | Select-Object Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: NovelAI-Harness-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  # 阶段二 B：构建 Android 分 ABI APK
  # --split-per-abi 由 Flutter Gradle 插件接管 ABI 拆分，
  # 各 APK 自动携带互不冲突的 versionCode，可直接上架/侧载。
  build-android:
    name: Build Android (split ABI)
    needs: [check, verify]
    if: >-
      !failure() && !cancelled() &&
      needs.check.outputs.should_build == 'true' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      # AGP 8.11 / Kotlin 2.2 需要 JDK 17+，同时顺带缓存 ~/.gradle
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Configure release signing (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64，改用 debug 签名构建。"
            exit 0
          fi
          STORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$STORE"
          {
            echo "storeFile=$STORE"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          echo "已写入 android/key.properties（正式签名）。"

      - name: Build Android APK (split per ABI)
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build apk --release --split-per-abi \
            --build-number "${{ github.run_number }}"

      - name: Rename APKs
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            out="NovelAI-Harness-v${VERSION}-android-${abi}.apk"
            cp "$apk" "$out"
          done
          ls -lh NovelAI-Harness-*-android-*.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk
          path: NovelAI-Harness-*-android-*.apk
          if-no-files-found: error
          retention-days: 7

  # 阶段二 C：构建 macOS (Apple Silicon / arm64) 发行包
  build-macos:
    name: Build macOS (arm64)
    needs: [check, verify]
    if: >-
      !failure() && !cancelled() &&
      needs.check.outputs.should_build == 'true' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          architecture: arm64
          cache: true

      - name: Record build environment
        run: |
          test "$(uname -m)" = arm64
          flutter --version
          xcodebuild -version
          flutter config --no-analytics

      - name: Build macOS release
        run: |
          flutter pub get
          flutter build macos --release \
            --build-number "${{ github.run_number }}"

      - name: Verify signed app and package
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/novelai_harness.app"
          codesign --verify --deep --strict "$app"
          lipo -archs "$app/Contents/MacOS/novelai_harness" | grep -w arm64
          codesign -d --entitlements :- "$app" > signed-entitlements.plist 2>/dev/null
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          data = plistlib.loads(Path('signed-entitlements.plist').read_bytes())
          for key in (
              'com.apple.security.app-sandbox',
              'com.apple.security.network.client',
              'com.apple.security.files.user-selected.read-write',
          ):
              assert data.get(key) is True, f'Missing signed entitlement: {key}'
              print(f'{key}: verified')
          PY

          zip="NovelAI-Harness-v${VERSION}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          ls -lh "$zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64
          path: NovelAI-Harness-*-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7

  # 阶段三：汇总产物、生成校验和与变更说明并创建 Release
  release:
    name: Create GitHub Release
    needs: [check, verify, build-windows, build-android, build-macos]
    if: >-
      !failure() && !cancelled() &&
      needs.check.outputs.should_release == 'true' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      needs.build-windows.result == 'success' &&
      needs.build-android.result == 'success' &&
      needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          fetch-depth: 0 # 完整历史，用于生成 commit 总结

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          (cd dist && sha256sum *.zip *.apk > SHA256SUMS.txt)
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: Generate commit summary
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # 找到上一个版本标签（排除当前版本号），确定 commit 范围
          PREV_TAG=$(git tag --merged HEAD --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            | grep -vx "v${VERSION}" \
            | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            RANGE_DESC="自上一版本 ${PREV_TAG} 以来"
          else
            FIRST=$(git rev-list --max-parents=0 HEAD | tail -n 1)
            RANGE="${FIRST}..HEAD"
            RANGE_DESC="首次发布"
          fi
          echo "commit 范围: $RANGE"

          NOTES="release_notes.md"
          {
            echo "## NovelAI Harness v${VERSION}"
            echo ""
            echo "${RANGE_DESC}的变更："
            echo ""

            emit() {
              local title="$1" re="$2"
              local body
              body=$(git log "$RANGE" --no-merges \
                     --extended-regexp --regexp-ignore-case \
                     --format='- %s (%h)' --grep="$re" || true)
              if [ -n "$body" ]; then
                echo "### $title"
                echo ""
                echo "$body"
                echo ""
              fi
            }

            emit "新功能" '^feat(\([^)]+\))?!?:'
            emit "修复" '^fix(\([^)]+\))?!?:'
            emit "性能" '^perf(\([^)]+\))?!?:'
            emit "重构" '^refactor(\([^)]+\))?!?:'
            emit "文档" '^docs(\([^)]+\))?!?:'

            OTHERS=$(git log "$RANGE" --no-merges --format='%s|%h' \
              | grep -viE \
                -e '^(feat|fix|perf|refactor|docs|test|chore|build|ci|style)(\([^)]+\))?!?:' \
              | awk -F'|' '{printf "- %s (%s)\n", $1, $NF}' || true)
            if [ -n "$OTHERS" ]; then
              echo "### 其他"
              echo ""
              echo "$OTHERS"
              echo ""
            fi

            WIN_ZIP="NovelAI-Harness-v${VERSION}-windows-x64.zip"
            MAC_ZIP="NovelAI-Harness-v${VERSION}-macos-arm64.zip"
            echo "### 下载"
            echo ""
            echo "| 平台 | 文件 |"
            echo "| --- | --- |"
            echo "| Windows x64 | \`$WIN_ZIP\` |"
            echo "| macOS (Apple Silicon / arm64) | \`$MAC_ZIP\` |"
            for APK in dist/NovelAI-Harness-v${VERSION}-android-*.apk; do
              [ -e "$APK" ] || continue
              APK_NAME=$(basename "$APK")
              ABI="${APK_NAME#NovelAI-Harness-v${VERSION}-android-}"
              ABI="${ABI%.apk}"
              echo "| Android ($ABI) | \`$APK_NAME\` |"
            done
            echo "| 校验和 | \`SHA256SUMS.txt\` |"
            echo ""
          } > "$NOTES"

          echo "----- 生成的 Release 说明 -----"
          cat "$NOTES"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NovelAI Harness v${VERSION}" \
            --notes-file release_notes.md \
            $PRERELEASE_FLAG \
            dist/*.zip dist/*.apk dist/SHA256SUMS.txt
